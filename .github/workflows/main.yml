name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # gh-metrics is the maintained fork of lowlighter/metrics (unmaintained since December 2023)
      # Pinned to a commit and built from source, so that updates only happen when this SHA changes
      - uses: gh-metrics/metrics@fee09759804eef7d236c6587e38f6044d74cf2a3
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: no
          config_timezone: Asia/Singapore
      # Each step below runs even if an earlier step failed, so one broken plugin does not block the others
      - name: Achievements (Compact display)
        if: ${{ !cancelled() }}
        uses: gh-metrics/metrics@fee09759804eef7d236c6587e38f6044d74cf2a3
        with:
          filename: metrics.plugin.achievements.compact.svg
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: no
          base: ""
          plugins_errors_fatal: yes
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
      - name: Spotify - Top tracks
        if: ${{ !cancelled() }}
        uses: gh-metrics/metrics@fee09759804eef7d236c6587e38f6044d74cf2a3
        with:
          filename: metrics.plugin.music.top.svg
          token: NOT_NEEDED
          use_prebuilt_image: no
          base: ""
          plugins_errors_fatal: yes
          plugin_music: yes
          plugin_music_mode: top
          plugin_music_provider: spotify
          plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
          plugin_music_time_range: short
          plugin_music_top_type: tracks
      - name: GitHub Skyline
        if: ${{ !cancelled() }}
        uses: gh-metrics/metrics@fee09759804eef7d236c6587e38f6044d74cf2a3
        with:
          filename: metrics.plugin.skyline.svg
          token: NOT_NEEDED
          use_prebuilt_image: no
          base: ""
          plugins_errors_fatal: yes
          plugin_skyline: yes
          plugin_skyline_year: current_year
          plugin_skyline_frames: 120
          plugin_skyline_quality: 1
          plugin_skyline_settings: |
            {
              "url": "https://honzaap.github.io/GithubCity?name=${login}&year=${year}",
              "ready": "[...document.querySelectorAll('.display-info span')].map(span => span.innerText).includes('${login}')",
              "wait": 4,
              "hide": ".github-corner, .footer-link, .buttons-options, .mobile-rotate, .display-info span:first-child"
            }
