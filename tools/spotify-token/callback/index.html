<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://accounts.spotify.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Spotify Token Renewal</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Spotify token renewal</h1>
    <section id="exchange" hidden>
      <p>Step 2 of 2. Spotify approved the request. Paste the <strong>Client secret</strong> from the dashboard within a few minutes, because the approval expires quickly.</p>
      <label for="client-secret">Client secret</label>
      <input id="client-secret" type="password" autocomplete="off" spellcheck="false">
      <button id="get-token" type="button">Get refresh token</button>
    </section>
    <section id="result" hidden>
      <p>Done. Copy this value into the <code>SPOTIFY_TOKENS</code> secret on the <a href="https://github.com/infinia-yzl/infinia-yzl/settings/secrets/actions/SPOTIFY_TOKENS" target="_blank" rel="noopener noreferrer">repository secret page</a>, then close this tab.</p>
      <label for="secret-value">SPOTIFY_TOKENS</label>
      <textarea id="secret-value" rows="4" readonly spellcheck="false"></textarea>
      <button id="copy" type="button">Copy</button>
    </section>
    <p id="message" class="message" role="status"></p>
    <p id="restart" hidden><a href="/">Start again</a></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
